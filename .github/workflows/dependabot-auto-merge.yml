name: "deps: dependabot auto-merge"

# Enables GitHub's native auto-merge for low-risk Dependabot PRs (GitHub Actions
# patch/minor). Auto-merge only completes once the required status checks pass,
# so the lint + integration tests remain the real gate. Major bumps fall through
# to manual review.
#
# Prerequisites (repo settings, one-time):
#   - Settings -> General -> "Allow auto-merge" enabled
#   - A branch protection rule on main requiring the CI checks to pass

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
